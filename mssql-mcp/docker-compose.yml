services:
  mssql-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: mssql-mcp:local
    container_name: mssql-mcp
    restart: always
    ports:
      - "8000:8000"
    environment:
      - SERVER_NAME=${SERVER_NAME}
      - DATABASE_NAME=${DATABASE_NAME}
      - SQL_USER=${SQL_USER}
      - SQL_PASSWORD=${SQL_PASSWORD}
      - TRUST_SERVER_CERTIFICATE=${TRUST_SERVER_CERTIFICATE:-true}
      - READONLY=${READONLY:-false}
      - CONNECTION_TIMEOUT=${CONNECTION_TIMEOUT:-30}
      - SERVER_PORT=${SERVER_PORT:-1433}
      - ENCRYPT=${ENCRYPT:-true}
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--api-key"
      - "${MCPO_API_KEY}"
      - "--config"
      - "/app/config.json"

  # Lab-internal static file server for the offline install bundle.
  # Serves whatever is in ./dist-offline/ at http://<this-host>:8080/.
  # Read-only and unauthenticated — intended for trusted LAN use only.
  # Only starts when you opt in:
  #   docker compose --profile offline-server up -d
  offline-files:
    image: nginx:alpine
    container_name: mssql-mcp-offline-files
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./dist-offline:/usr/share/nginx/html:ro
    profiles:
      - offline-server
