# Topology (no secrets). Mounted at /app/config/srm.yaml.
# Keep this in sync with config/srm.example.yaml. Passwords come from the Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: srm-topology
  namespace: srm-mcp
data:
  srm.yaml: |
    domain: rtolab.local
    sso_user: administrator@vsphere.local
    sso_pass_env: SRM_SSO_PASS
    appliance_user: admin
    appliance_pass_env: SRM_APPLIANCE_PASS
    sites:
      site1:
        name: rtolab-521-site1
        role: protected
        sddc_id: vcf-m02b
        vcenter: { fqdn: kosten-vcf521b-vc.rtolab.local, ip: 192.168.114.96, instance_uuid: d777434b-e8d6-4b94-9297-5bc59811e3e7 }
        vr:  { fqdn: kosten-vcf521b-vr.rtolab.local,  ip: 192.168.114.46 }
        srm: { fqdn: kosten-vcf521b-srm.rtolab.local, ip: 192.168.114.47 }
      site2:
        name: rtolab-521-site2
        role: recovery
        sddc_id: vcf-m02c
        vcenter: { fqdn: kosten-vcf521-vc.rtolab.local, ip: 192.168.114.56, instance_uuid: b6648f6c-382d-4be3-8570-79ccab9bc8a6 }
        vr:  { fqdn: kosten-vcf521-vr.rtolab.local,  ip: 192.168.114.48 }
        srm: { fqdn: kosten-vcf521-srm.rtolab.local, ip: 192.168.114.49 }
