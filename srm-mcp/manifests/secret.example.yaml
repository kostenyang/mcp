# Copy to secret.yaml, fill in real values, apply — and do NOT commit secret.yaml.
# Better: create it imperatively so values never hit disk in the repo:
#
#   kubectl -n srm-mcp create secret generic srm-secrets \
#     --from-literal=SRM_SSO_PASS='<your-vcenter-sso-password>' \
#     --from-literal=SRM_APPLIANCE_PASS='<your-appliance-vami-password>' \
#     --from-literal=SRM_MCP_API_KEYS="$(openssl rand -hex 24)"
#
apiVersion: v1
kind: Secret
metadata:
  name: srm-secrets
  namespace: srm-mcp
type: Opaque
stringData:
  SRM_SSO_PASS: "REPLACE_ME"
  SRM_APPLIANCE_PASS: "REPLACE_ME"
  # comma-separated Bearer tokens accepted by the server
  SRM_MCP_API_KEYS: "REPLACE_WITH_RANDOM_TOKEN"
